[program:web]
command=frankenphp php-server --root /app/public --listen %(ENV_SERVER_NAME)s
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php /app/artisan queue:work --sleep=1 --tries=1 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
user=www-data
autorestart=true
stopwaitsecs=330
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
