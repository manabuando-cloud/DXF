services:
  app:
    build: .
    image: cad-convert
    restart: unless-stopped
    ports:
      # Only reachable from this machine. HTTPS is added by a reverse proxy
      # (see deploy/Caddyfile.example). To test from other PCs on the LAN
      # without HTTPS, change this to "8080:8080".
      - "127.0.0.1:8080:8080"
    environment:
      APP_NAME: "CAD Convert"
      # Public address, e.g. https://cad.example.com
      APP_URL: "http://localhost:8080"
      QUEUE_WORKERS: 2
      CONVERTER_RETENTION_MINUTES: 60
      CONVERTER_MAX_FILES: 50
      CONVERTER_MAX_FILE_KB: 51200
      CONVERTER_RATE_LIMIT: 20
      # Reverse proxies allowed to set X-Forwarded-For / -Proto.
      # The default covers a proxy on the Docker host.
      TRUSTED_PROXIES: "127.0.0.1,::1,172.16.0.0/12"
    volumes:
      - storage:/app/storage

volumes:
  storage:
